version: '3.8'

services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: ragagainsthemachine:latest
    container_name: rag-local-dev
    mem_limit: 2g
    cpus: '2'
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./data/output:/app/data/output
    environment:
      PYTHONUNBUFFERED: '1'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
    stdin_open: true
    tty: true
    entrypoint: python -m student
    command: help

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ragagainsthemachine:latest
    container_name: rag-backend
    mem_limit: 2g
    cpus: '2'
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./data/output:/app/data/output
    environment:
      PYTHONUNBUFFERED: '1'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
    ports:
      - "8000:8000"
    command: uvicorn student.oracle_api:app --host 0.0.0.0 --port 8000
