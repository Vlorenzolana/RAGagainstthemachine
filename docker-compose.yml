version: "3.8"
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - engine
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      - API_KEY=${API_KEY:-}
      - LLM_ENGINE_URL=http://engine:8001
    depends_on:
      - engine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
