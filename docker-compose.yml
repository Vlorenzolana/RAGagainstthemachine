version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: oracle-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    mem_limit: 128m
    cpus: "0.25"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: oracle-api
    environment:
      API_KEY: ${API_KEY:-}
      LLM_ENGINE_URL: ${LLM_ENGINE_URL:-http://engine:8001}
    depends_on:
      - engine
    mem_limit: 256m
    cpus: "0.50"

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    container_name: oracle-engine
    mem_limit: 256m
    cpus: "0.50"
