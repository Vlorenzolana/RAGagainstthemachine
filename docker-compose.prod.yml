version: '3.8'

# Docker Compose for 42 School deployment
# Use: docker-compose -f docker-compose.prod.yml up --build

services:
  rag-42:
    build:
      context: .
      dockerfile: Dockerfile
    image: ragagainsthemachine:prod
    container_name: rag-42-prod
    mem_limit: 2g
    cpus: '2'
    volumes:
      - /tmp/rag_data/raw:/app/data/raw:ro
      - /tmp/rag_data/processed:/app/data/processed
      - /tmp/rag_data/output:/app/data/output
    environment:
      PYTHONUNBUFFERED: '1'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: uvicorn student.oracle_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
