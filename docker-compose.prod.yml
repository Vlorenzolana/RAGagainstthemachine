version: '3.8'

# Docker Compose for 42 School deployment
# Use: docker-compose -f docker-compose.prod.yml up

services:
  rag-42:
    build:
      context: .
      dockerfile: Dockerfile
    image: ragagainsthemachine:prod
    container_name: rag-42-prod
    
    # Conservative resource limits for 42 machines
    mem_limit: 2g
    cpus: '2'
    
    # Use /tmp (or specify larger mount)
    # Note: Adjust paths based on 42 environment
    volumes:
      # If /tmp is limited, mount a larger directory (e.g., /mnt/shared)
      - /tmp/rag_data:/app/data
      - /tmp/rag_models:/models
    
    environment:
      # Point to larger directories if /tmp is limited
      # TRANSFORMERS_CACHE: /mnt/shared/.cache/huggingface
      # TORCH_HOME: /mnt/shared/.cache/torch
      TRANSFORMERS_CACHE: /models/transformers
      TORCH_HOME: /models/torch
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: '1'
    
    # Non-interactive, log to stdout
    stdin_open: false
    tty: false
    
    # Restart policy for robust deployment
    restart: on-failure
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
      window: 120s
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    entrypoint: python -m student
    command: help
